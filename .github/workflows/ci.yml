name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Windows is not optional here: normalize_path_key() folds case via
    # os.path.normcase and joins with os.sep, so the path handling this app is
    # built around behaves differently per platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      # The tests build their schema from the migrations already, so what is
      # left to verify is that the migrations still describe models.py.
      - name: Apply migrations to an empty database
        run: flask db upgrade

      - name: Check models and schema agree
        run: flask db check

      - name: Check for a single migration head
        shell: bash
        run: |
          count=$(flask db heads | grep -c '(head)')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count:"
            flask db heads
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI=true makes react-scripts treat ESLint warnings as errors, so this is
      # the lint gate as well as the build. REACT_APP_API_URL is baked into the
      # bundle at build time and would otherwise land as "undefined".
      - name: Build
        env:
          CI: "true"
          REACT_APP_API_URL: http://localhost:5000
        run: npm run build
